[Service]
# Sustained-heat-only boost policy:
# - Ignore harmless 100ms-2s single-P-core turbo spikes (HOT_C=101, RISE_C=99, RISE_FLOOR_C=105)
#   which previously triggered ~17 nuisance 4,057 RPM blasts/hour and 3-15ms SMM stalls.
# - Engage full max cooling immediately on genuine sustained heat (60s rolling average >= 82 C),
#   and hand back cleanly to Dell BIOS EC once cooled <= 78 C for 20s and avg < 72 C.
Environment="HOT_C=101" "RISE_C=99" "RISE_FLOOR_C=105" "AVG_WINDOW_S=60" "AVG_ON_C=82" "AVG_OFF_C=72" "COOL_C=78" "COOL_HOLD_S=20" "MIN_BOOST_S=30"
